plugins {
    id 'com.android.application' version '9.3.2'
}

repositories {
    mavenCentral()
    google()
}

android {
    namespace = 'itkach.aard2'
    compileSdk 37

    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE']
            project("slobj").file("exclude.txt").eachLine {
                line ->
                    println line
                    if (line && line.trim() && !line.startsWith("#")) {
                        excludes += line.trim()
                    }
            }
        }
    }


    lint {
        abortOnError = false
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    if (System.getenv("KEYSTORE") != null) {
        signingConfigs {
            release {
                storeFile file(System.getenv("KEYSTORE"))
                storePassword System.getenv("STORE_PASSWORD")
                keyPassword System.getenv("KEY_PASSWORD")
                if (keyPassword == null) {
                    keyPassword = storePassword
                }
                keyAlias "aard2-android"
            }
        }
    }

    buildTypes {
        if (System.getenv("KEYSTORE") != null) {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
    }

}

dependencies {
    api 'androidx.fragment:fragment:1.7.1'
    api 'androidx.viewpager:viewpager:1.0.0'
    api 'androidx.recyclerview:recyclerview:1.2.1'
    api 'androidx.recyclerview:recyclerview-selection:1.1.0'
    api 'androidx.core:core:1.13.1'
    api 'androidx.documentfile:documentfile:1.0.1'
    api 'androidx.annotation:annotation:1.8.0'
    api 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    api 'com.google.android.material:material:1.12.0'
    api 'com.fasterxml.jackson.core:jackson-databind:2.4+'
    api 'com.fasterxml.jackson.core:jackson-core:2.4+'
    api 'com.fasterxml.jackson.core:jackson-annotations:2.4+'
    api project(':slobj')
    api project(':slobber')
}
